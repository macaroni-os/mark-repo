skipped_resolutions:
  packages:
    - name: elt-patches
      category: app-portage

build_template_file: templates/build-pkg-uses-subsets2.yaml.tmpl

global_annotations:
  subsets:
    rules:
      devel:
        - "^/usr/include/"
      portage:
        - "^/var/db/pkg/"

artefacts:

- tree: packages/atoms/
  mutations:
    provides:
      - category: system
        name: entities
        version: "0.9.2+2"
    conflicts:
      - category: system
        name: entities
        version: '0.9.2'
  packages:
    - app-admin/entities

- tree: packages/atoms/
  mutations:
    # The whip package from mark-kit
    # supply already the default config
    # file for macaroni.
    provides:
      - category: whip-profiles
        name: macaroni
        version: "2"
      - category: whip-profiles
        name: funtoo
        version: "2"
    conflicts:
      - category: whip-profiles
        name: macaroni
        version: "<2"
      - category: whip-profiles
        name: funtoo
        version: "<2"
  packages:
    - app-admin/whip

- tree: packages/atoms/
  mutations:
    provides:
      - category: system
        name: luet-geaaru
        version: "0.41.1+7"
      - category: system
        name: luet-geaaru-testing
        version: "0.41.1+7"
      - category: system
        name: luet-geaaru-thin
        version: "0.41.1+7"
    conflicts:
      - category: system
        name: luet-geaaru
        version: '<0.41.1+7'
      - category: system
        name: luet-geaaru-testing
        version: '<0.41.1+7'
      - category: system
        name: luet-geaaru-thin
        version: '<0.41.1+7'
  packages:
    - app-admin/anise

- tree: packages/atoms/
  mutations:
    buildtime_deps:
      packages:
        - category: seed
          name: mark-kits
    provides:
      - category: macaroni
        name: whip-catalog
        version: "0.20240323+2"
    conflicts:
      - category: macaroni
        name: whip-catalog
        version: '<0.20240323'
  packages:
    - sys-apps/whip-catalog

- tree: packages/atoms/
  mutations:
    provides:
      - category: macaroni
        name: anise-portage-converter
        version: "0.16.3+1"
  packages:
    - app-admin/anise-portage-converter

- tree: packages/atoms/
  mutations:
    provides:
      - category: system
        name: luet-build
        version: "0.41.1+1"
  packages:
    - app-admin/anise-build

- tree: packages/atoms/
  packages:
    - dev-util/pkgs-checker
    - dev-util/mark-devkit
    - dev-util/ssh-compose
    - app-emulation/lxd-compose

- tree: packages/atoms/
  replacements:
    runtime_deps:
      # Needed until macaroni-os/mark-issues#255 is done
      ignore:
        - category: dev-vcs
          name: git
  mutations:
    provides:
      - category: utils
        name: yq4
        version: 4.44.6
      - category: app-misc
        name: yq4
        version: 4.44.6
  packages:
    - app-misc/yq-go

- tree: packages/atoms/
  mutations:
    buildtime_deps:
      packages:
        - category: seed
          name: mark-kits
    provides:
      - category: utils
        name: yq
        version: 3.4.1
  packages:
    - app-misc/yq3-bin

- tree: packages/atoms/
  mutations:
    buildtime_deps:
      packages:
        - category: seed
          name: mark-kits
    conflicts:
      - category: app-misc
        name: yq-go
  packages:
    - app-misc/yq4-bin

- tree: packages/atoms/
  mutations:
    buildtime_deps:
      packages:
        - category: seed
          name: mark-kits
    conflicts:
      - category: app-misc
        name: jq
    provides:
      - category: utils
        name: jq
        version: 1.8.1
  packages:
    - app-misc/jq-bin


include_layers:
- layers/mark-kits.yaml

# Define the list of the files generated by Funtoo reposcan tool.
reposcan_sources:
- ./kit-cache/core-hw-kit-mark-xl
- ./kit-cache/core-server-kit-mark-xl
- ./kit-cache/editors-kit-mark-xl
- ./kit-cache/llvm-kit-mark-xl
- ./kit-cache/perl-kit-mark-xl
- ./kit-cache/python-kit-mark-xl
- ./kit-cache/science-kit-mark-xl
- ./kit-cache/text-kit-mark-xl
- ./kit-cache/core-kit-mark-xl
- ./kit-cache/dev-kit-mark-xl
- ./kit-cache/kernel-kit-mark-xl
- ./kit-cache/lang-kit-mark-xl
- ./kit-cache/net-kit-mark-xl
- ./kit-cache/portage-kit-mark-xl
- ./kit-cache/python-modules-kit-mark-xl
- ./kit-cache/security-kit-mark-xl
- ./kit-cache/xorg-kit-mark-xl
- ./kit-cache/mark-kit-mark-xl

trees:
- ../packages/seeds
- ../packages/atoms

# Disable use of category with slot as requires. Default is without slot.
reposcan_requires_slot: true

reposcan_contraints:
  packages:
    - dev-lang/python:3.9
    - sys-devel/gcc:12.3.0

